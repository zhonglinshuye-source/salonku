<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Salonku リンク生成ツール</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  :root {
    --pink: #EC1E63; --pink-deep: #C4104C; --pink-soft: #FFE8EF;
    --ink: #2A2226; --ink-soft: #857A80; --line: #F0E4E8; --bg: #FAF7F8; --green: #25D366;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; padding: 0 0 40px; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 0 16px; }

  .topbar { background: linear-gradient(135deg, var(--pink) 0%, #FF5C8A 100%); padding: 20px 16px; color: white; margin-bottom: 18px; }
  .topbar h1 { font-size: 18px; font-weight: 800; margin-bottom: 3px; }
  .topbar p { font-size: 12px; opacity: 0.9; }

  .field-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field-row label { font-size: 12.5px; color: var(--ink-soft); font-weight: 700; }
  .field-row input, .field-row select { padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line); font-size: 14px; font-family: 'Inter', sans-serif; width: 100%; background: white; }
  .row2 { display: flex; gap: 8px; }
  .row2 .field-row { flex: 1; }

  .days { display: flex; gap: 6px; flex-wrap: wrap; }
  .day-chip { padding: 8px 12px; border-radius: 20px; border: 1.5px solid var(--line); font-size: 12.5px; font-weight: 700; color: var(--ink-soft); background: white; }
  .day-chip.active { background: var(--pink); border-color: var(--pink); color: white; }

  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px; border-radius: 10px; font-weight: 700; font-size: 14px; border: none; width: 100%; margin-top: 6px; }
  .btn-primary { background: var(--pink); color: white; }

  .result { display: none; margin-top: 18px; background: white; border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .result.show { display: block; }
  .result h3 { font-size: 13.5px; margin-bottom: 8px; font-weight: 800; }
  .url-box { font-size: 12px; word-break: break-all; background: var(--pink-soft); color: var(--pink-deep); padding: 10px; border-radius: 8px; margin-bottom: 10px; font-family: monospace; }
  .btn-copy { background: var(--ink); color: white; }
  .btn-wa { background: var(--green); color: white; margin-top: 8px; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: white; padding: 11px 16px; border-radius: 10px; font-size: 13px; max-width: 90vw; opacity: 0; transition: all 0.25s ease; pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .note { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }
</style>
</head>
<body>

  <div class="topbar">
    <h1>Salonku リンク生成ツール</h1>
    <p>店舗情報を入力するだけで、専用の予約リンクを自動作成します</p>
  </div>

  <div class="wrap">
    <div class="field-row">
      <label>店名</label>
      <input id="nama" placeholder="例：Mimin Salon">
    </div>
    <div class="field-row">
      <label>エリア・住所メモ</label>
      <input id="meta" placeholder="例：Airlangga, Surabaya">
    </div>
    <div class="field-row">
      <label>WhatsApp番号（国番号62から、ハイフンなし）</label>
      <input id="wa" placeholder="例：6288830513143">
      <div class="note">店の番号を「+62」から始まる形でハイフンなしで入力してください</div>
    </div>
    <div class="row2">
      <div class="field-row">
        <label>開店時間</label>
        <input type="time" id="buka" value="10:00">
      </div>
      <div class="field-row">
        <label>閉店時間</label>
        <input type="time" id="tutup" value="19:00">
      </div>
    </div>
    <div class="field-row">
      <label>予約の間隔（分）</label>
      <select id="interval">
        <option value="30">30分ごと</option>
        <option value="60" selected>60分ごと</option>
        <option value="90">90分ごと</option>
      </select>
    </div>
    <div class="field-row">
      <label>営業日（タップして選択）</label>
      <div class="days" id="dayChips"></div>
    </div>

    <button class="btn btn-primary" id="generateBtn">リンクを作成</button>

    <div class="result" id="result">
      <h3>できたリンク</h3>
      <div class="url-box" id="urlBox"></div>
      <button class="btn btn-copy" id="copyBtn">リンクをコピー</button>
      <button class="btn btn-wa" id="sendWaBtn">この内容でWhatsAppに送る</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const BASE_URL = 'https://zhonglinshuye-source.github.io/salonku/booking.html';

  const DAY_LABELS = ['日', '月', '火', '水', '木', '金', '土'];
  let selectedDays = new Set([1, 2, 3, 4, 5, 6]);

  function renderDayChips() {
    const wrap = document.getElementById('dayChips');
    wrap.innerHTML = '';
    DAY_LABELS.forEach((label, i) => {
      const chip = document.createElement('div');
      chip.className = 'day-chip' + (selectedDays.has(i) ? ' active' : '');
      chip.textContent = label;
      chip.addEventListener('click', () => {
        if (selectedDays.has(i)) selectedDays.delete(i);
        else selectedDays.add(i);
        renderDayChips();
      });
      wrap.appendChild(chip);
    });
  }
  renderDayChips();

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
  }

  let generatedUrl = '';
  let generatedNama = '';
  let generatedWa = '';

  document.getElementById('generateBtn').addEventListener('click', () => {
    const nama = document.getElementById('nama').value.trim();
    const meta = document.getElementById('meta').value.trim();
    const wa = document.getElementById('wa').value.trim().replace(/[^0-9]/g, '');
    const buka = document.getElementById('buka').value;
    const tutup = document.getElementById('tutup').value;
    const interval = document.getElementById('interval').value;
    const hari = [...selectedDays].sort().join(',');

    if (!nama || !wa || !buka || !tutup || selectedDays.size === 0) {
      showToast('店名・WhatsApp番号・時間・営業日を入力してください');
      return;
    }
    if (!wa.startsWith('62')) {
      showToast('WhatsApp番号は62から始まる形式で入力してください');
      return;
    }

    const params = new URLSearchParams({ nama, meta, wa, buka, tutup, interval, hari });
    generatedUrl = `${BASE_URL}?${params.toString()}`;
    generatedNama = nama;
    generatedWa = wa;

    document.getElementById('urlBox').textContent = generatedUrl;
    document.getElementById('result').classList.add('show');
    document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(generatedUrl);
      showToast('コピーしました');
    } catch (e) {
      showToast('コピーに失敗しました、手動で選択してください');
    }
  });

  document.getElementById('sendWaBtn').addEventListener('click', () => {
    const msg = `Halo ${generatedNama}, ini link booking khusus untuk salon Anda: ${generatedUrl}\n\nBisa langsung dibagikan ke pelanggan, tidak perlu install aplikasi apapun. Gratis 🙌`;
    const url = `https://wa.me/${generatedWa}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
  });
</script>
</body>
</html>
