<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kelola Salonku</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --pink: #EC1E63;
    --pink-deep: #C4104C;
    --pink-soft: #FFE8EF;
    --gold: #F2A900;
    --ink: #2A2226;
    --ink-soft: #857A80;
    --line: #F0E4E8;
    --bg: #FAF7F8;
    --green: #25D366;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink);
    line-height: 1.5; padding-bottom: 76px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  }
  .wrap { max-width: 460px; margin: 0 auto; }

  .topbar { background: linear-gradient(135deg, var(--pink) 0%, #FF5C8A 100%); padding: 16px; color: white; }
  .topbar h1 { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 3px; }
  .topbar p { font-size: 12.5px; opacity: 0.9; }

  .tabs { display: flex; background: white; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
  .tab { flex: 1; text-align: center; padding: 13px 0; font-size: 13px; font-weight: 700; color: var(--ink-soft); border-bottom: 3px solid transparent; background: none; border-left: none; border-right: none; border-top: none; }
  .tab.active { color: var(--pink); border-bottom-color: var(--pink); }

  .view { display: none; padding: 16px; }
  .view.active { display: block; }

  .card { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .card-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .card h3 { font-size: 14.5px; font-weight: 700; margin-bottom: 2px; }
  .card .meta { font-size: 12px; color: var(--ink-soft); }
  .badge { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 20px; flex-shrink: 0; }
  .badge.open { background: #EAF7EE; color: #1E8449; }
  .badge.booked { background: var(--pink-soft); color: var(--pink-deep); }

  .empty { text-align: center; padding: 40px 16px; color: var(--ink-soft); font-size: 13.5px; }

  .sec-title { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin: 18px 0 8px; text-transform: uppercase; letter-spacing: 0.03em; }

  .field-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .field-row label { font-size: 12.5px; color: var(--ink-soft); font-weight: 700; }
  .field-row input, .field-row select {
    padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line);
    font-size: 14px; font-family: 'Inter', sans-serif; background: white; width: 100%;
  }
  .row2 { display: flex; gap: 8px; }
  .row2 .field-row { flex: 1; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 12px 18px; border-radius: 10px; font-weight: 700; font-size: 13.5px; border: none; width: 100%; }
  .btn-primary { background: var(--pink); color: white; }
  .btn-wa { background: var(--green); color: white; }
  .btn-ghost { background: var(--pink-soft); color: var(--pink-deep); }
  .btn-danger { background: #FBEAE7; color: #B3543F; }
  .btn-row { display: flex; gap: 8px; margin-top: 8px; }
  .btn-row .btn { flex: 1; }

  .toast {
    position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: white; padding: 11px 16px; border-radius: 10px;
    font-size: 13px; max-width: 90vw; opacity: 0; transition: all 0.25s ease; pointer-events: none; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .fab {
    position: fixed; right: 18px; bottom: calc(90px + env(safe-area-inset-bottom, 0px));
    width: 54px; height: 54px; border-radius: 50%; background: var(--pink); color: white;
    font-size: 26px; border: none; box-shadow: 0 4px 12px rgba(236,30,99,0.35); z-index: 20;
  }

  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 30;
    align-items: flex-end; justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: white; width: 100%; max-width: 460px; border-radius: 18px 18px 0 0;
    padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px));
    max-height: 85vh; overflow-y: auto;
  }
  .modal h2 { font-size: 16px; font-weight: 800; margin-bottom: 14px; }
  .modal-close { text-align: right; font-size: 13px; color: var(--ink-soft); padding: 4px 0 12px; background: none; border: none; width: 100%; }

  .empty-icon { font-size: 34px; margin-bottom: 8px; }
</style>
</head>
<body>

  <div class="topbar">
    <h1>Kelola Salonku</h1>
    <p>Jadwal &amp; pelanggan, semua di satu tempat</p>
  </div>

  <div class="tabs">
    <button class="tab active" data-view="jadwal">Jadwal</button>
    <button class="tab" data-view="pelanggan">Pelanggan</button>
  </div>

  <div class="wrap">
    <div class="view active" id="view-jadwal">
      <div id="jadwalList"></div>
      <div class="empty" id="jadwalEmpty" style="display:none;">
        <div class="empty-icon">📅</div>
        Belum ada jadwal. Ketuk tombol + untuk menambah jam.
      </div>
    </div>

    <div class="view" id="view-pelanggan">
      <div id="pelangganList"></div>
      <div class="empty" id="pelangganEmpty" style="display:none;">
        <div class="empty-icon">👤</div>
        Belum ada pelanggan tersimpan. Ketuk tombol + untuk menambah.
      </div>
    </div>
  </div>

  <button class="fab" id="fabAdd">+</button>
  <div class="toast" id="toast"></div>

  <div class="modal-backdrop" id="modalJadwal">
    <div class="modal">
      <button class="modal-close" id="closeJadwal">Tutup ✕</button>
      <h2>Tambah jam</h2>
      <div class="row2">
        <div class="field-row"><label>Tanggal</label><input type="date" id="j-tanggal"></div>
        <div class="field-row"><label>Jam</label><input type="time" id="j-jam"></div>
      </div>
      <div class="field-row"><label>Nama pelanggan (opsional, kosongkan jika masih kosong)</label>
        <input id="j-nama" placeholder="Contoh: Bu Sari" list="pelangganDatalist">
        <datalist id="pelangganDatalist"></datalist>
      </div>
      <div class="field-row"><label>Nomor WhatsApp pelanggan (opsional)</label><input id="j-wa" placeholder="6281234567890"></div>
      <button class="btn btn-primary" id="j-save">Simpan</button>
    </div>
  </div>

  <div class="modal-backdrop" id="modalPelanggan">
    <div class="modal">
      <button class="modal-close" id="closePelanggan">Tutup ✕</button>
      <h2>Tambah pelanggan</h2>
      <div class="field-row"><label>Nama</label><input id="p-nama" placeholder="Contoh: Bu Sari"></div>
      <div class="field-row"><label>Nomor WhatsApp</label><input id="p-wa" placeholder="6281234567890"></div>
      <div class="field-row"><label>Catatan (opsional)</label><input id="p-catatan" placeholder="Contoh: suka warna rambut cokelat"></div>
      <button class="btn btn-primary" id="p-save">Simpan</button>
    </div>
  </div>

<script>
  const JADWAL_KEY = 'kelola_salonku_jadwal';
  const PELANGGAN_KEY = 'kelola_salonku_pelanggan';

  function load(key) {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : []; }
    catch (e) { return []; }
  }
  function save(key, data) {
    try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {}
  }

  let jadwal = load(JADWAL_KEY);
  let pelanggan = load(PELANGGAN_KEY);

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('view-' + tab.dataset.view).classList.add('active');
    });
  });

  function fmtTanggal(iso) {
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' });
  }

  function renderJadwal() {
    const list = document.getElementById('jadwalList');
    const empty = document.getElementById('jadwalEmpty');
    const sorted = [...jadwal].sort((a, b) => (a.tanggal + a.jam).localeCompare(b.tanggal + b.jam));
    list.innerHTML = '';
    if (sorted.length === 0) { empty.style.display = 'block'; return; }
    empty.style.display = 'none';

    sorted.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      const isBooked = !!item.nama;
      card.innerHTML = `
        <div class="card-row">
          <div>
            <h3>${fmtTanggal(item.tanggal)} · ${item.jam}</h3>
            <div class="meta">${isBooked ? item.nama : 'Belum ada booking'}</div>
          </div>
          <span class="badge ${isBooked ? 'booked' : 'open'}">${isBooked ? 'Terisi' : 'Kosong'}</span>
        </div>
        <div class="btn-row"></div>
      `;
      const btnRow = card.querySelector('.btn-row');
      if (isBooked && item.wa) {
        const waBtn = document.createElement('button');
        waBtn.className = 'btn btn-wa';
        waBtn.textContent = 'Kirim reminder';
        waBtn.addEventListener('click', () => sendReminder(item));
        btnRow.appendChild(waBtn);
      }
      const delBtn = document.createElement('button');
      delBtn.className = 'btn btn-danger';
      delBtn.textContent = 'Hapus';
      delBtn.addEventListener('click', () => {
        jadwal = jadwal.filter(j => j.id !== item.id);
        save(JADWAL_KEY, jadwal);
        renderJadwal();
        showToast('Jadwal dihapus');
      });
      btnRow.appendChild(delBtn);
      list.appendChild(card);
    });
  }

  function sendReminder(item) {
    const msg = `Halo ${item.nama}, ini pengingat jadwal Anda besok tanggal ${fmtTanggal(item.tanggal)} jam ${item.jam}. Sampai jumpa! 💇`;
    const url = `https://wa.me/${item.wa}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
  }

  function renderPelanggan() {
    const list = document.getElementById('pelangganList');
    const empty = document.getElementById('pelangganEmpty');
    const datalist = document.getElementById('pelangganDatalist');
    list.innerHTML = '';
    datalist.innerHTML = '';
    if (pelanggan.length === 0) { empty.style.display = 'block'; return; }
    empty.style.display = 'none';

    pelanggan.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.nama;
      datalist.appendChild(opt);

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-row">
          <div>
            <h3>${p.nama}</h3>
            <div class="meta">${p.wa || '-'}${p.catatan ? ' · ' + p.catatan : ''}</div>
          </div>
        </div>
        <div class="btn-row"></div>
      `;
      const btnRow = card.querySelector('.btn-row');
      if (p.wa) {
        const waBtn = document.createElement('button');
        waBtn.className = 'btn btn-wa';
        waBtn.textContent = 'Chat WhatsApp';
        waBtn.addEventListener('click', () => window.open(`https://wa.me/${p.wa}`, '_blank'));
        btnRow.appendChild(waBtn);
      }
      const delBtn = document.createElement('button');
      delBtn.className = 'btn btn-danger';
      delBtn.textContent = 'Hapus';
      delBtn.addEventListener('click', () => {
        pelanggan = pelanggan.filter(x => x.id !== p.id);
        save(PELANGGAN_KEY, pelanggan);
        renderPelanggan();
        showToast('Pelanggan dihapus');
      });
      btnRow.appendChild(delBtn);
      list.appendChild(card);
    });
  }

  document.getElementById('fabAdd').addEventListener('click', () => {
    const activeView = document.querySelector('.tab.active').dataset.view;
    if (activeView === 'jadwal') {
      document.getElementById('j-tanggal').value = new Date().toISOString().slice(0, 10);
      document.getElementById('modalJadwal').classList.add('open');
    } else {
      document.getElementById('modalPelanggan').classList.add('open');
    }
  });

  document.getElementById('closeJadwal').addEventListener('click', () => document.getElementById('modalJadwal').classList.remove('open'));
  document.getElementById('closePelanggan').addEventListener('click', () => document.getElementById('modalPelanggan').classList.remove('open'));

  document.getElementById('j-save').addEventListener('click', () => {
    const tanggal = document.getElementById('j-tanggal').value;
    const jam = document.getElementById('j-jam').value;
    const nama = document.getElementById('j-nama').value.trim();
    const wa = document.getElementById('j-wa').value.trim();
    if (!tanggal || !jam) { showToast('Isi tanggal dan jam dulu ya'); return; }

    jadwal.push({ id: uid(), tanggal, jam, nama, wa });
    save(JADWAL_KEY, jadwal);
    renderJadwal();
    document.getElementById('modalJadwal').classList.remove('open');
    showToast('Jadwal ditambahkan');
    ['j-nama', 'j-wa'].forEach(id => document.getElementById(id).value = '');
  });

  document.getElementById('p-save').addEventListener('click', () => {
    const nama = document.getElementById('p-nama').value.trim();
    const wa = document.getElementById('p-wa').value.trim();
    const catatan = document.getElementById('p-catatan').value.trim();
    if (!nama) { showToast('Isi nama dulu ya'); return; }

    pelanggan.push({ id: uid(), nama, wa, catatan });
    save(PELANGGAN_KEY, pelanggan);
    renderPelanggan();
    document.getElementById('modalPelanggan').classList.remove('open');
    showToast('Pelanggan ditambahkan');
    ['p-nama', 'p-wa', 'p-catatan'].forEach(id => document.getElementById(id).value = '');
  });

  renderJadwal();
  renderPelanggan();
</script>
</body>
</html>
